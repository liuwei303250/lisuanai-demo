<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中芯力算 · AI Token 聚合分发平台 Demo</title>
<link rel="icon" href="assets/logo-whiten.png">
<style>
/* ============ 设计令牌(与品牌红 logo 同源) ============ */
:root{
  /* 品牌 */
  --brand:#DA251C; --brand-deep:#B01E16; --brand-dark:#8F1A12; --brand-light:#FEF1F0; --brand-orange:#F26B1A;
  /* 中性 */
  --ink:#17171E; --ink2:#4B5563; --ink3:#8A8F98; --line:#ECEDF0; --line2:#F3F4F6; --bg:#F7F8FA; --card:#FFFFFF;
  /* 语义 */
  --green:#16A34A; --green-bg:#EAF7EF; --amber:#C77E10; --amber-bg:#FFF6E8; --red:#DC2626; --red-bg:#FDECEC;
  /* 层级(暖色系:红→橙→石) */
  --lv1:#DA251C; --lv2:#C2410C; --lv3:#9A3412; --lv4:#57534E; --lv5:#78716C;
  /* 侧栏 */
  --sidebar:#14141B; --sidebar-ink:#9CA1AB; --sidebar-line:rgba(255,255,255,.06);
  --radius:12px; --shadow-sm:0 1px 2px rgba(23,23,30,.04); --shadow-md:0 8px 24px rgba(23,23,30,.08);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:var(--ink);background:#fff;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--brand-light)}

/* ============ Logo ============ */
.logo{display:flex;align-items:center;gap:8px;font-weight:700}
.logo-mark{height:34px;border-radius:6px;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(218,37,28,.25)}
.logo-mark img{height:100%;width:auto;display:block}

/* ============ 落地页(参照 kove.cn 白色 SaaS 风格) ============ */
.lp-nav{position:fixed;top:0;width:100%;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.lp-nav-in{max-width:1200px;margin:0 auto;height:64px;display:flex;align-items:center;gap:32px;padding:0 24px}
.lp-nav-links{display:flex;gap:6px;flex:1;justify-content:center}
.lp-nav-links a{color:var(--ink2);font-size:14px;padding:7px 14px;border-radius:8px;transition:all .15s}
.lp-nav-links a:hover{color:var(--brand);background:var(--brand-light)}
.lp-nav-links a.on{color:var(--brand);background:var(--brand-light);font-weight:600}
.lp-nav-cta{display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;padding:9px 18px;font-size:14px;border:1px solid transparent;transition:all .15s;font-weight:500;line-height:1.4}
.btn:focus-visible{outline:3px solid rgba(218,37,28,.25)}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-deep)}
.btn-ghost{border-color:var(--line);color:var(--ink2);background:#fff}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-sm{padding:5px 12px;font-size:13px;border-radius:7px}
.lp-sec{padding:72px 24px}
.lp-sec-white{background:#fff}
.lp-sec-gray{background:var(--bg)}
.lp-in{max-width:1200px;margin:0 auto}
.lp-hero{padding:150px 24px 80px;text-align:center;background:linear-gradient(180deg,#FEF5F3 0%,#fff 100%)}
.lp-hero h1{font-size:44px;line-height:1.25;letter-spacing:.5px}
.lp-hero h1 .hl{color:var(--brand)}
.lp-hero p{margin:18px auto 30px;max-width:640px;color:var(--ink2);font-size:16px}
.lp-sec-title{text-align:center;margin-bottom:44px}
.lp-sec-title h2{font-size:30px}
.lp-sec-title p{color:var(--ink3);margin-top:8px}
.lp-grid{display:grid;gap:20px}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.lp-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px;transition:all .2s;box-shadow:var(--shadow-sm)}
.lp-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:#F5D9D6}
.lp-card .ico{width:44px;height:44px;border-radius:12px;background:var(--brand-light);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:21px;margin-bottom:14px}
.lp-card h3{font-size:16px;margin-bottom:8px}
.lp-card p{color:var(--ink3);font-size:13px}
.lp-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:step}
.lp-step{position:relative;padding:24px 20px 20px;border:1px solid var(--line);border-radius:var(--radius);background:#fff}
.lp-step::before{counter-increment:step;content:counter(step);position:absolute;top:-15px;left:20px;background:linear-gradient(135deg,var(--brand),var(--brand-orange));color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;box-shadow:0 4px 10px rgba(218,37,28,.3)}
.lp-step h3{font-size:15px;margin:8px 0 6px}
.lp-step p{font-size:13px;color:var(--ink3)}
.lp-cta{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-orange) 100%);color:#fff;text-align:center;border-radius:20px;padding:56px 24px;box-shadow:0 16px 40px rgba(218,37,28,.3)}
.lp-cta h2{font-size:28px;margin-bottom:12px}
.lp-cta .btn{background:#fff;color:var(--brand);font-size:15px;padding:12px 28px}
.lp-footer{background:#17171E;color:#9CA1AB;padding:48px 24px;font-size:13px}
.lp-footer a{color:#9CA1AB}
.lp-footer a:hover{color:#fff}
.lp-footer-in{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:32px}
.lp-footer h4{color:#fff;margin-bottom:12px;font-size:14px}
.lp-footer div p{margin-top:4px}
.model-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;transition:all .2s;cursor:pointer;box-shadow:var(--shadow-sm)}
.model-card:hover{box-shadow:var(--shadow-md);border-color:#F5D9D6}
.model-name{font-weight:600;font-size:15px}
.model-tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--brand-light);color:var(--brand);margin-left:8px}
.model-price{margin-top:10px;font-size:13px;color:var(--ink3)}
.model-price b{color:var(--ink);font-size:15px}
.model-meta{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
.mtag{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--line2);color:var(--ink2)}
.price-table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.price-table th{background:#FAFAFB;padding:14px;text-align:left;font-weight:600;border-bottom:1px solid var(--line);color:var(--ink2)}
.price-table td{padding:14px;border-bottom:1px solid var(--line2);font-size:13px}
.price-table tr:hover td{background:#FEF8F7}

/* ============ 控制台 ============ */
.console{display:flex;min-height:100vh}
.sidebar{width:232px;background:var(--sidebar);color:var(--sidebar-ink);position:fixed;top:0;bottom:0;left:0;overflow-y:auto;padding:16px 12px;z-index:40;display:flex;flex-direction:column}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:4px}
.sidebar .logo{padding:6px 10px 18px;color:#fff}
.sidebar .logo .logo-mark{box-shadow:0 4px 14px rgba(218,37,28,.45)}
.sb-sec{margin-bottom:4px}
.sb-group{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;font-size:11px;color:#555B66;padding:13px 12px 7px;letter-spacing:1.5px}
.sb-group::after{content:'▾';font-size:10px;transition:transform .2s}
.sb-sec.collapsed .sb-group::after{transform:rotate(-90deg)}
.sb-sec.collapsed .sb-body{display:none}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;color:var(--sidebar-ink);font-size:13.5px;transition:all .15s;margin-bottom:2px}
.sb-item:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-item.on{background:linear-gradient(135deg,var(--brand),var(--brand-deep));color:#fff;box-shadow:0 4px 12px rgba(218,37,28,.35)}
.sb-item .n{margin-left:auto;font-size:11px;opacity:.6}
.sidebar .sb-foot{margin-top:auto;padding:14px 10px 4px;border-top:1px solid var(--sidebar-line);font-size:11px;color:#555B66}
.c-main{flex:1;margin-left:232px;padding:24px 28px 40px;background:var(--bg);min-height:100vh}
.c-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow-sm)}
.c-title{font-size:17px;font-weight:700}
.crumb{font-size:12px;color:var(--ink3);margin-top:2px}
.crumb b{color:var(--ink2);font-weight:500}
.c-search{width:210px;padding:8px 14px;border:1px solid var(--line);border-radius:9px;background:var(--bg);font-size:13px;color:var(--ink2)}
.c-search:focus{outline:none;background:#fff;border-color:var(--brand)}
.burger{display:none;width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:17px;color:var(--ink2)}

/* ============ 组件库 ============ */
.card{background:#fff;border-radius:var(--radius);border:1px solid var(--line);padding:22px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.card h3{font-size:15px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.card h3::before{content:'';width:4px;height:16px;background:linear-gradient(180deg,var(--brand),var(--brand-orange));border-radius:2px;flex:none}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.stat::after{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--brand),var(--brand-orange));opacity:.85}
.stat .k{font-size:12px;color:var(--ink3);display:flex;align-items:center;gap:6px}
.stat .ico{width:26px;height:26px;border-radius:8px;background:var(--brand-light);display:flex;align-items:center;justify-content:center;font-size:13px}
.stat .v{font-size:25px;font-weight:700;margin:8px 0 2px;letter-spacing:-.3px}
.stat .d{font-size:12px;color:var(--ink3)}
.d-pill{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;margin-left:4px}
.d-pill.up{background:var(--green-bg);color:var(--green)}
.d-pill.down{background:var(--red-bg);color:var(--red)}
table.tbl{width:100%;border-collapse:collapse}
table.tbl th{text-align:left;padding:10px 12px;font-size:12px;color:var(--ink3);border-bottom:1px solid var(--line);background:#FAFAFB;white-space:nowrap;font-weight:500}
table.tbl td{padding:12px;border-bottom:1px solid var(--line2);font-size:13px}
table.tbl tr:hover td{background:#FEF8F7}
table.tbl td a{color:var(--brand);margin-right:8px}
table.tbl td a:hover{color:var(--brand-deep);text-decoration:underline}
.badge{display:inline-block;font-size:11px;padding:2px 10px;border-radius:20px;white-space:nowrap;font-weight:500}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.badge.gray{background:var(--line2);color:var(--ink2)}
.badge.brand{background:var(--brand-light);color:var(--brand)}
.tabbar{display:flex;gap:4px;background:var(--line2);border-radius:11px;padding:4px;margin-bottom:18px;width:max-content;max-width:100%;overflow-x:auto}
.tabbar a{padding:7px 16px;font-size:13.5px;color:var(--ink2);border-radius:8px;transition:all .15s;white-space:nowrap}
.tabbar a:hover{color:var(--brand)}
.tabbar a.on{background:#fff;color:var(--brand);font-weight:600;box-shadow:var(--shadow-sm)}
.form-row{display:grid;grid-template-columns:130px 1fr;gap:14px;margin-bottom:16px;align-items:start}
.form-row label{text-align:right;color:var(--ink2);padding-top:8px;font-size:13px}
.form-row label .req{color:var(--red)}
.inp{width:100%;max-width:430px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fff;transition:all .15s}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(218,37,28,.12)}
textarea.inp{min-height:80px;resize:vertical}
.hint{font-size:12px;color:var(--ink3);margin-top:5px}
.key-box{background:#17171E;color:#7EE787;font-family:Consolas,monospace;padding:14px 16px;border-radius:10px;word-break:break-all;font-size:13px;position:relative;line-height:1.7}
.key-box .copy{position:absolute;right:8px;top:8px;background:rgba(255,255,255,.1);border:none;color:#fff;padding:3px 10px;border-radius:6px;font-size:12px}
.key-box .copy:hover{background:rgba(255,255,255,.2)}
.alert{border-radius:10px;padding:12px 16px;font-size:13px;margin-bottom:16px;line-height:1.6}
.alert.info{background:#F0F5FF;color:#1E4BA6}
.alert.warn{background:var(--amber-bg);color:var(--amber)}
.alert.ok{background:var(--green-bg);color:var(--green)}
.alert.brand{background:var(--brand-light);color:var(--brand-deep)}
.progress{height:8px;background:var(--line2);border-radius:4px;overflow:hidden;min-width:80px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-orange));border-radius:4px}
.pager{display:flex;gap:6px;justify-content:flex-end;margin-top:14px}
.pager span{min-width:30px;height:30px;padding:0 8px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;font-size:13px;color:var(--ink2);cursor:pointer}
.pager span.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.spark{width:100%;height:64px;display:block}
.poster-box{height:170px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600;letter-spacing:2px}
.poster-1{background:linear-gradient(135deg,#DA251C,#F26B1A)}
.poster-2{background:linear-gradient(135deg,#17171E,#4B5563)}
.poster-3{background:linear-gradient(135deg,#9A3412,#C2410C)}

/* ============ 下拉菜单 ============ */
.dd{position:relative}
.dd-btn{display:flex;align-items:center;gap:6px;cursor:pointer;padding:7px 12px;border-radius:9px;font-size:13px;color:var(--ink2);background:#fff;border:1px solid var(--line)}
.dd-btn:hover{border-color:var(--brand);color:var(--brand)}
.dd-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-md);min-width:200px;z-index:60;overflow:hidden}
.dd.open .dd-menu{display:block}
.dd-menu a{display:block;padding:10px 16px;font-size:13px;color:var(--ink2)}
.dd-menu a:hover{background:var(--brand-light);color:var(--brand)}
.dd-menu .sep{border-top:1px solid var(--line2)}
.dot{width:8px;height:8px;background:var(--brand);border-radius:50%;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:45}
.overlay.show{display:block}

/* ============ 首页 Hero ============ */
.hero-logo{height:88px;width:auto;margin:0 auto 22px;filter:drop-shadow(0 12px 24px rgba(218,37,28,.35))}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:36px}
.chip{padding:7px 16px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--ink2);box-shadow:0 4px 12px rgba(23,23,30,.05);animation:float 4s ease-in-out infinite}
.chip:nth-child(2){animation-delay:.8s}.chip:nth-child(3){animation-delay:1.6s}.chip:nth-child(4){animation-delay:2.4s}.chip:nth-child(5){animation-delay:3.2s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* ============ 页面地图 ============ */
details.pgmap{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-sm)}
details.pgmap summary{cursor:pointer;padding:13px 18px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:10px;list-style:none}
details.pgmap summary::-webkit-details-marker{display:none}
details.pgmap summary::before{content:'▸';color:var(--brand);transition:transform .2s}
details.pgmap[open] summary::before{transform:rotate(90deg)}
details.pgmap .lv{padding:9px 18px;border-top:1px solid var(--line2)}
details.pgmap .lv:hover{background:#FEF8F7}
details.pgmap .lv a{color:var(--ink2)}
details.pgmap .lv a:hover{color:var(--brand)}
.lv-tag{font-size:11px;padding:2px 8px;border-radius:6px;color:#fff;font-weight:600}
.l1{background:var(--lv1)}.l2{background:var(--lv2)}.l3{background:var(--lv3)}.l4{background:var(--lv4)}.l5{background:var(--lv5)}
.lv-path{font-family:Consolas,monospace;font-size:11px;color:#B8BCC4;flex:none;width:340px}

/* ============ AI Agent 交互层 ============ */
/* 入场动效 */
.card,.stat,.lp-card{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* Toast 操作反馈 */
#toast-wrap{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:rgba(23,23,30,.92);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-md);animation:toastIn .25s ease}
.toast.out{opacity:0;transition:opacity .3s}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
/* AI 助手悬浮球 */
.ai-fab{position:fixed;right:20px;bottom:20px;width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand-orange));color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;z-index:150;border:none;box-shadow:0 8px 24px rgba(218,37,28,.45);transition:transform .2s}
.ai-fab:hover{transform:scale(1.08)}
.ai-fab::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(218,37,28,.4);animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:1}100%{transform:scale(1.5);opacity:0}}
.ai-panel{display:none;position:fixed;right:20px;bottom:86px;width:340px;max-width:calc(100vw - 40px);background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(23,23,30,.25);z-index:150;overflow:hidden;flex-direction:column}
.ai-panel.open{display:flex}
.ai-panel .hd{background:linear-gradient(135deg,var(--brand),var(--brand-orange));color:#fff;padding:14px 16px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.ai-panel .bd{max-height:280px;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.ai-msg{max-width:85%;padding:9px 13px;border-radius:12px;font-size:13px;line-height:1.6}
.ai-msg.user{align-self:flex-end;background:var(--brand);color:#fff;border-radius:12px 12px 4px 12px}
.ai-msg.bot{align-self:flex-start;background:var(--line2);border-radius:12px 12px 12px 4px}
.ai-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px}
.ai-chip{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid var(--line);color:var(--ink2);background:#fff;cursor:pointer;transition:all .15s}
.ai-chip:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-light)}
.ai-panel .ft{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line2)}
.ai-panel .ft .inp{flex:1;max-width:none;border-radius:20px;padding:7px 14px;background:var(--bg)}
/* 智能建议卡 */
.smart-tip{border:1px solid #F5D9D6;background:linear-gradient(135deg,#FFF9F8,#FEF3F0);border-radius:var(--radius);padding:16px 18px;margin-bottom:18px;display:flex;gap:12px;align-items:flex-start}
.smart-tip .ro{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
.smart-tip b{font-size:14px}
.smart-tip p{font-size:13px;color:var(--ink2);margin-top:3px}

/* ============ 水印 ============ */
.demo-note{position:fixed;right:12px;bottom:12px;background:rgba(23,23,30,.85);color:#fff;font-size:11px;padding:6px 12px;border-radius:20px;z-index:99}

/* ============ 响应式 ============ */
@media(max-width:900px){
  .lp-nav-links{display:none}.g3,.g4,.lp-steps{grid-template-columns:1fr 1fr}.stat-grid{grid-template-columns:1fr 1fr}
  .sidebar{transform:translateX(-100%);transition:transform .25s;width:232px}
