<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中芯力算 · AI Token 聚合分发平台 Demo</title>
<link rel="icon" href="assets/logo.png">
<style>
:root{
  --brand:#DA251C; --brand-deep:#B01E16; --brand-light:#FEF0EF; --brand-orange:#F26B1A;
  --ink:#13131C; --ink2:#4B5563; --ink3:#6B7280; --line:#E5E5E5; --bg:#F7F8FA; --card:#FFFFFF;
  --violet:#4f46e5; --green:#16A34A; --green-bg:#E8F7EE; --amber:#D97706; --amber-bg:#FFF7E6;
  --red:#DC2626; --red-bg:#FDECEC; --sidebar:#13131C; --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;color:var(--ink);background:#fff;font-size:14px;line-height:1.6}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
.logo{display:flex;align-items:center;gap:8px;font-weight:700}
.logo-mark{width:36px;height:36px;border-radius:9px;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(218,37,28,.25)}
.logo-mark img{width:100%;height:100%;object-fit:cover;display:block}
.logo-text{font-size:17px;letter-spacing:.5px}
.logo-sub{font-size:11px;color:var(--ink3);font-weight:400}
/* ===== 落地页(参照 kove.cn 白色 SaaS 风格) ===== */
.lp-nav{position:fixed;top:0;width:100%;z-index:50;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid #f0f0f0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.lp-nav-in{max-width:1200px;margin:0 auto;height:64px;display:flex;align-items:center;gap:32px;padding:0 24px}
.lp-nav-links{display:flex;gap:28px;flex:1;justify-content:center}
.lp-nav-links a{color:var(--ink2);font-size:15px;transition:color .15s}
.lp-nav-links a:hover,.lp-nav-links a.on{color:var(--brand)}
.lp-nav-cta{display:flex;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:8px;padding:9px 18px;font-size:14px;border:1px solid transparent;transition:all .15s;font-weight:500}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-deep)}
.btn-ghost{border-color:var(--line);color:var(--ink2);background:#fff}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-sm{padding:5px 12px;font-size:13px;border-radius:6px}
.lp-sec{padding:72px 24px}
.lp-sec-white{background:#fff}
.lp-sec-gray{background:#f7f8fa}
.lp-in{max-width:1200px;margin:0 auto}
.lp-hero{padding:150px 24px 80px;text-align:center;background:linear-gradient(180deg,#FFF7F5 0%,#fff 100%)}
.lp-hero h1{font-size:44px;line-height:1.25;letter-spacing:.5px}
.lp-hero h1 .hl{color:var(--brand)}
.lp-hero p{margin:18px auto 30px;max-width:640px;color:var(--ink2);font-size:16px}
.lp-sec-title{text-align:center;margin-bottom:44px}
.lp-sec-title h2{font-size:30px}
.lp-sec-title p{color:var(--ink3);margin-top:8px}
.lp-grid{display:grid;gap:20px}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.lp-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px;transition:all .2s}
.lp-card:hover{box-shadow:0 8px 24px rgba(0,0,0,.07);transform:translateY(-2px)}
.lp-card .ico{width:42px;height:42px;border-radius:10px;background:var(--brand-light);color:var(--brand);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:14px}
.lp-card h3{font-size:16px;margin-bottom:8px}
.lp-card p{color:var(--ink3);font-size:13px}
.lp-steps{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;counter-reset:step}
.lp-step{position:relative;padding:22px;border:1px dashed var(--line);border-radius:var(--radius)}
.lp-step::before{counter-increment:step;content:counter(step);position:absolute;top:-14px;left:20px;background:var(--brand);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700}
.lp-cta{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-orange) 100%);color:#fff;text-align:center;border-radius:20px;padding:56px 24px}
.lp-cta h2{font-size:28px;margin-bottom:12px}
.lp-cta .btn{background:#fff;color:var(--brand);font-size:15px;padding:12px 28px}
.lp-footer{background:var(--ink);color:#9ca3af;padding:48px 24px;font-size:13px}
.lp-footer a{color:#9ca3af}
.lp-footer a:hover{color:#fff}
.lp-footer-in{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:32px}
.lp-footer h4{color:#fff;margin-bottom:12px;font-size:14px}
.lp-footer div p{margin-top:4px}
/* 模型卡片 */
.model-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;transition:all .2s;cursor:pointer}
.model-card:hover{box-shadow:0 8px 24px rgba(0,0,0,.08)}
.model-name{font-weight:600;font-size:15px}
.model-tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;background:var(--brand-light);color:var(--brand);margin-left:8px}
.model-price{margin-top:10px;font-size:13px;color:var(--ink3)}
.model-price b{color:var(--ink);font-size:15px}
.model-meta{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap}
.mtag{font-size:11px;padding:2px 8px;border-radius:6px;background:#f3f4f6;color:var(--ink2)}
/* 价格表 */
.price-table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
.price-table th{background:#fafafa;padding:14px;text-align:left;font-weight:600;border-bottom:1px solid var(--line)}
.price-table td{padding:14px;border-bottom:1px solid #f5f5f5;font-size:13px}
.price-table tr:hover td{background:#fffaf8}
/* ===== 控制台 ===== */
.console{display:flex;min-height:100vh}
.sidebar{width:232px;background:var(--sidebar);color:#9ca3af;position:fixed;top:0;bottom:0;left:0;overflow-y:auto;padding:16px 12px;z-index:40}
.sidebar .logo{padding:6px 10px 18px;color:#fff}
.sidebar .logo-mark{background:var(--brand)}
.sb-group{font-size:11px;color:#565a66;padding:14px 10px 6px;letter-spacing:1px}
.sb-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;color:#9ca3af;font-size:14px;transition:all .15s;margin-bottom:2px;cursor:pointer}
.sb-item:hover{background:rgba(255,255,255,.06);color:#fff}
.sb-item.on{background:var(--brand);color:#fff}
.sb-item .n{margin-left:auto;font-size:11px;opacity:.6}
.c-main{flex:1;margin-left:232px;padding:26px 32px;background:var(--bg);min-height:100vh}
.c-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.c-title{font-size:20px;font-weight:700}
.crumb{font-size:12px;color:var(--ink3);margin-top:2px}
.crumb b{color:var(--ink2);font-weight:500}
.c-search{width:220px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:13px;color:var(--ink3)}
/* 组件 */
.card{background:#fff;border-radius:var(--radius);border:1px solid var(--line);padding:22px;margin-bottom:18px}
.card h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.stat .k{font-size:12px;color:var(--ink3)}
.stat .v{font-size:26px;font-weight:700;margin:6px 0 2px}
.stat .d{font-size:12px;color:var(--ink3)}
.stat .d.up{color:var(--green)}
.stat .d.down{color:var(--red)}
table.tbl{width:100%;border-collapse:collapse}
table.tbl th{text-align:left;padding:10px 12px;font-size:12px;color:var(--ink3);border-bottom:1px solid var(--line);background:#fafafa;white-space:nowrap}
table.tbl td{padding:11px 12px;border-bottom:1px solid #f5f5f5;font-size:13px}
table.tbl tr:hover td{background:#fffaf8}
.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;white-space:nowrap}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.red{background:var(--red-bg);color:var(--red)}
.badge.amber{background:var(--amber-bg);color:var(--amber)}
.badge.gray{background:#f3f4f6;color:var(--ink2)}
.badge.violet{background:#F1ECFF;color:var(--violet)}
.badge.brand{background:var(--brand-light);color:var(--brand)}
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabbar a{padding:9px 16px;font-size:14px;color:var(--ink2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabbar a.on{color:var(--brand);border-color:var(--brand);font-weight:600}
.form-row{display:grid;grid-template-columns:120px 1fr;gap:14px;margin-bottom:14px;align-items:start}
.form-row label{text-align:right;color:var(--ink2);padding-top:8px;font-size:13px}
.form-row label .req{color:var(--red)}
.inp{width:100%;max-width:420px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px}
.inp:focus{outline:2px solid var(--brand-light);border-color:var(--brand)}
textarea.inp{min-height:80px;resize:vertical}
.hint{font-size:12px;color:var(--ink3);margin-top:5px}
.key-box{background:#13131C;color:#7EE787;font-family:Consolas,monospace;padding:14px;border-radius:8px;word-break:break-all;font-size:13px;position:relative}
.key-box .copy{position:absolute;right:8px;top:8px;background:rgba(255,255,255,.1);border:none;color:#fff;padding:3px 10px;border-radius:6px;font-size:12px}
.alert{border-radius:8px;padding:12px 16px;font-size:13px;margin-bottom:16px}
.alert.info{background:#EFF6FF;color:#1e40af}
.alert.warn{background:var(--amber-bg);color:var(--amber)}
.alert.ok{background:var(--green-bg);color:var(--green)}
.alert.brand{background:var(--brand-light);color:var(--brand-deep)}
.chart-placeholder{background:repeating-linear-gradient(135deg,#fafafa,#fafafa 12px,#f5f5f5 12px,#f5f5f5 24px);border:1px dashed #ddd;border-radius:8px;height:220px;display:flex;align-items:center;justify-content:center;color:#b0b0b0;font-size:13px}
.mini-chart{display:flex;align-items:flex-end;gap:4px;height:64px}
.mini-chart i{flex:1;background:linear-gradient(180deg,var(--brand),var(--brand-orange));border-radius:3px 3px 0 0;min-height:6px}
.pager{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.pager span{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:6px;font-size:13px;color:var(--ink2)}
.pager span.on{background:var(--brand);color:#fff;border-color:var(--brand)}
/* 页面地图 */
.sitemap .lv{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;margin-bottom:4px;transition:all .15s}
.sitemap .lv:hover{background:#fff}
.sitemap .lv a{flex:1;color:var(--ink2)}
.sitemap .lv a:hover{color:var(--brand)}
.lv-tag{font-size:11px;padding:2px 8px;border-radius:6px;flex:none;width:44px;text-align:center}
.l1{background:var(--brand);color:#fff}
.l2{background:var(--violet);color:#fff}
.l3{background:#7C5CFF;color:#fff}
.l4{background:#0ea5e9;color:#fff}
.l5{background:#64748b;color:#fff}
.lv-path{font-family:Consolas,monospace;font-size:11px;color:#b0b0b0;flex:none;width:340px}
/* ===== 优化增强样式 ===== */
/* SVG 趋势图 */
.spark{width:100%;height:64px;display:block}
/* 侧栏分组折叠 */
.sb-sec{margin-bottom:6px}
.sb-group{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;font-size:11px;color:#565a66;padding:12px 10px 6px;letter-spacing:1px}
.sb-group::after{content:'▾';font-size:10px;transition:transform .2s}
.sb-sec.collapsed .sb-group::after{transform:rotate(-90deg)}
.sb-sec.collapsed .sb-body{display:none}
.sb-body .sb-item{transition:all .15s}
/* 下拉菜单 */
.dd{position:relative}
.dd-btn{display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px 10px;border-radius:8px;font-size:13px;color:var(--ink2);background:#fff;border:1px solid var(--line)}
.dd-btn:hover{border-color:var(--brand);color:var(--brand)}
.dd-menu{display:none;position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.1);min-width:180px;z-index:60;overflow:hidden}
.dd.open .dd-menu{display:block}
.dd-menu a{display:block;padding:10px 16px;font-size:13px;color:var(--ink2)}
.dd-menu a:hover{background:var(--brand-light);color:var(--brand)}
.dd-menu .sep{border-top:1px solid #f0f0f0}
.dot{width:8px;height:8px;background:var(--brand);border-radius:50%;display:inline-block;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* 移动端抽屉 */
.burger{display:none;width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:17px;color:var(--ink2)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:45}
.overlay.show{display:block}
/* 首页 Hero 品牌化 */
.hero-logo{height:72px;margin:0 auto 22px;filter:drop-shadow(0 10px 22px rgba(218,37,28,.35))}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:34px}
.chip{padding:7px 16px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--ink2);box-shadow:0 4px 12px rgba(0,0,0,.05);animation:float 4s ease-in-out infinite}
.chip:nth-child(2){animation-delay:.8s}.chip:nth-child(3){animation-delay:1.6s}.chip:nth-child(4){animation-delay:2.4s}.chip:nth-child(5){animation-delay:3.2s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
/* 海报占位升级 */
.poster-box{height:170px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:600;letter-spacing:2px}
.poster-1{background:linear-gradient(135deg,#DA251C,#F26B1A)}
.poster-2{background:linear-gradient(135deg,#13131C,#4B5563)}
.poster-3{background:linear-gradient(135deg,#7C5CFF,#4f46e5)}
/* 页面地图折叠 */
details.pgmap{border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:12px;overflow:hidden}
details.pgmap summary{cursor:pointer;padding:13px 18px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:10px;list-style:none}
details.pgmap summary::-webkit-details-marker{display:none}
details.pgmap summary::before{content:'▸';color:var(--brand);transition:transform .2s}
details.pgmap[open] summary::before{transform:rotate(90deg)}
details.pgmap .lv{padding:8px 18px}
details.pgmap .lv:hover{background:#fffaf8}
/* 演示水印 */
.demo-note{position:fixed;right:12px;bottom:12px;background:rgba(19,19,28,.85);color:#fff;font-size:11px;padding:6px 12px;border-radius:20px;z-index:99}
@media(max-width:900px){
  .lp-nav-links{display:none}.g3,.g4,.lp-steps{grid-template-columns:1fr 1fr}.stat-grid{grid-template-columns:1fr 1fr}
  .sidebar{transform:translateX(-100%);transition:transform .25s;width:232px}
  .sidebar.open{transform:translateX(0);box-shadow:8px 0 30px rgba(0,0,0,.3)}
  .c-main{margin-left:0}
  .burger{display:flex;align-items:center;justify-content:center}
  .c-search{display:none}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="demo-note">中芯力算 Demo · www.lisuanai.cn · 页面导航见「控制台-页面地图」</div>
<script src="router.js"></script>
<script src="pages-landing.js"></script>
<script src="pages-console.js"></script>
<script src="pages-detail.js"></script>
<script>render();</script>
</body>
</html>
